name: "🎮 سيف الله - Auto Build APK + AAB"

on:
  workflow_dispatch:
  push:
    paths:
      - "SaifAllahGame.zip"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    name: "Build Android Game"
    runs-on: ubuntu-latest

    steps:

      # 1️⃣ تحميل ملفات الريبو
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      # 2️⃣ إعداد Java
      - name: "☕ Setup Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3️⃣ إعداد Node.js
      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 4️⃣ فك ضغط اللعبة
      - name: "📦 Extract Game ZIP"
        shell: bash
        run: |
          set -e

          rm -rf game
          mkdir -p game

          unzip -q "SaifAllahGame.zip" -d game

          echo "📂 Files after extraction:"
          find game -maxdepth 3 -type f | head -100

      # 5️⃣ العثور على مجلد المشروع الحقيقي
      - name: "🔎 Find Game Project"
        shell: bash
        run: |
          set -e

          if [ -f "game/package.json" ]; then
            echo "PROJECT_DIR=game" >> "$GITHUB_ENV"
            exit 0
          fi

          PROJECT=$(find game -type f -name "package.json" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            echo "❌ لم يتم العثور على package.json داخل SaifAllahGame.zip"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "✅ Project found:"
          echo "$PROJECT"

      # 6️⃣ تثبيت npm
      - name: "📚 Install Dependencies"
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 7️⃣ التأكد من وجود Capacitor
      - name: "⚡ Setup Capacitor"
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            echo "Creating Capacitor configuration..."

            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ahmedgames.saifullah",
            "appName": "سيف الله",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          fi

          if ! npm list @capacitor/core >/dev/null 2>&1; then
            npm install @capacitor/core @capacitor/cli @capacitor/android
          fi

      # 8️⃣ إنشاء Android
      - name: "🤖 Create Android Project"
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

      # 9️⃣ تحديث ملفات التطبيق
      - name: "🔄 Capacitor Sync"
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx cap copy android
          npx cap sync android

      # 🔟 إعداد Android SDK
      - name: "📱 Setup Android SDK"
        uses: android-actions/setup-android@v3

      # 1️⃣1️⃣ تثبيت أدوات Android المطلوبة
      - name: "🛠️ Install Android SDK"
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 1️⃣2️⃣ صلاحيات Gradle
      - name: "🔐 Prepare Gradle"
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

      # 1️⃣3️⃣ بناء APK
      - name: "📦 Build Debug APK"
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          ./gradlew assembleDebug --no-daemon --stacktrace

      # 1️⃣4️⃣ بناء AAB
      - name: "📦 Build Release AAB"
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          ./gradlew bundleRelease --no-daemon --stacktrace

      # 1️⃣5️⃣ تجهيز الملفات النهائية
      - name: "📤 Prepare Build Files"
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/output"

          APK=$(find "$PROJECT_DIR/android" -type f -name "*.apk" | head -1)
          AAB=$(find "$PROJECT_DIR/android" -type f -name "*.aab" | head -1)

          if [ -z "$APK" ]; then
            echo "❌ APK لم يتم إنشاؤه"
            exit 1
          fi

          if [ -z "$AAB" ]; then
            echo "❌ AAB لم يتم إنشاؤه"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/output/SaifAllah-debug.apk"
          cp "$AAB" "$GITHUB_WORKSPACE/output/SaifAllah-release.aab"

          echo "✅ APK:"
          ls -lh "$GITHUB_WORKSPACE/output/SaifAllah-debug.apk"

          echo "✅ AAB:"
          ls -lh "$GITHUB_WORKSPACE/output/SaifAllah-release.aab"

      # 1️⃣6️⃣ رفع APK و AAB
      - name: "⬆️ Upload Android Builds"
        uses: actions/upload-artifact@v4
        with:
          name: SaifAllah-Android-Build
          path: output/
          if-no-files-found: error
          retention-days: 30
