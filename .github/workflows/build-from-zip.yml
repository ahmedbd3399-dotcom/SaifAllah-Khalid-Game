name: "🚀 تحويل ZIP إلى APK"

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      - name: "📥 تحميل المشروع"
        uses: actions/checkout@v4

      - name: "☕ إعداد Java"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: "🟢 إعداد Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "📦 البحث عن ZIP"
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "❌ لم يتم العثور على ملف ZIP"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"

          echo "✅ الملف:"
          echo "$ZIP"

      - name: "📂 فك الضغط"
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir project

          unzip -q "$ZIP_FILE" -d project

          echo "📁 محتويات ZIP:"
          find project -maxdepth 3 -type f | head -100

      - name: "🔎 البحث عن index.html"
        shell: bash
        run: |
          set -e

          INDEX=$(find project -type f -name "index.html" | head -1)

          if [ -z "$INDEX" ]; then
            echo "❌ لم يتم العثور على index.html"
            echo "هذا الملف يجب أن يكون موجودًا داخل المشروع."
            exit 1
          fi

          WEB_DIR=$(dirname "$INDEX")

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

          echo "✅ تم العثور على الموقع:"
          echo "$WEB_DIR"

      - name: "📦 إنشاء مشروع Capacitor"
        shell: bash
        run: |
          set -e

          cd "$WEB_DIR"

          if [ ! -f package.json ]; then

            cat > package.json <<'EOF'
          {
            "name": "zip-to-apk",
            "version": "1.0.0",
            "private": true
          }
          EOF

          fi

          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: "⚙️ إعداد Capacitor"
        shell: bash
        run: |
          set -e

          cd "$WEB_DIR"

          if [ ! -f capacitor.config.json ]; then

            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ahmedgames.app",
            "appName": "Ahmed Games",
            "webDir": ".",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          fi

      - name: "🤖 إنشاء Android"
        shell: bash
        run: |
          set -e

          cd "$WEB_DIR"

          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: "🔄 تحديث Android"
        shell: bash
        run: |
          set -e

          cd "$WEB_DIR"

          npx cap sync android

      - name: "📱 إعداد Android SDK"
        uses: android-actions/setup-android@v3

      - name: "🛠️ تثبيت Android SDK"
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: "🔨 بناء APK"
        shell: bash
        run: |
          set -e

          cd "$WEB_DIR/android"

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: "📤 تجهيز APK"
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/output"

          APK=$(find "$WEB_DIR/android" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "❌ لم يتم إنشاء APK"
            exit 1
          fi

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/app-debug.apk"

          echo "================================"
          echo "✅ APK جاهز"
          echo "================================"

          ls -lh "$GITHUB_WORKSPACE/output/app-debug.apk"

      - name: "⬆️ رفع APK"
        uses: actions/upload-artifact@v4
        with:
          name: APK-جاهز
          path: output/app-debug.apk
          if-no-files-found: error
          retention-days: 30
