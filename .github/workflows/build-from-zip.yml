name: "🚀 تحويل أي ZIP إلى APK"

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: "🔨 Build APK"
    runs-on: ubuntu-latest

    steps:

      - name: "📥 تحميل المشروع"
        uses: actions/checkout@v4

      - name: "☕ إعداد Java"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: "🟢 إعداد Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "📦 البحث عن ملف ZIP"
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "❌ لم يتم العثور على أي ملف ZIP"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"

          echo "✅ تم العثور على:"
          echo "$ZIP"

      - name: "📂 فك جميع ملفات ZIP"
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "🔍 البحث عن ملفات ZIP داخل ZIP..."

          ROUND=1

          while true; do

            NESTED=$(find extracted \
              -type f \
              -iname "*.zip" \
              | head -1)

            if [ -z "$NESTED" ]; then
              break
            fi

            echo "📦 ZIP داخلي:"
            echo "$NESTED"

            DIR=$(dirname "$NESTED")

            unzip -q "$NESTED" -d "$DIR"

            rm -f "$NESTED"

            ROUND=$((ROUND + 1))

            if [ "$ROUND" -gt 10 ]; then
              echo "❌ يوجد أكثر من 10 مستويات ZIP متداخلة"
              exit 1
            fi

          done

          echo "✅ انتهى فك الضغط"

          echo "📁 الملفات الموجودة:"
          find extracted -maxdepth 5 -type f | head -200

      - name: "🔎 البحث عن index.html"
        shell: bash
        run: |
          set -e

          INDEX=$(find extracted \
            -type f \
            -iname "index.html" \
            | head -1)

          if [ -z "$INDEX" ]; then
            echo "❌ لم يتم العثور على index.html"
            echo ""
            echo "الـZIP لا يحتوي على مشروع Web صالح."
            echo "يجب أن يحتوي على index.html"
            exit 1
          fi

          echo "INDEX_FILE=$INDEX" >> "$GITHUB_ENV"

          echo "✅ تم العثور على:"
          echo "$INDEX"

      - name: "🌐 تجهيز ملفات اللعبة"
        shell: bash
        run: |
          set -e

          rm -rf app
          mkdir -p app/www

          WEB_DIR=$(dirname "$INDEX_FILE")

          echo "📁 مجلد الموقع:"
          echo "$WEB_DIR"

          cp -a "$WEB_DIR"/. app/www/

          echo "✅ تم تجهيز ملفات الموقع"

          echo "📄 الملفات:"
          find app/www -maxdepth 3 -type f | head -200

      - name: "📦 إنشاء package.json"
        shell: bash
        run: |
          set -e

          cd app

          cat > package.json <<'EOF'
          {
            "name": "zip-to-apk",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo build"
            }
          }
          EOF

      - name: "⚡ تثبيت Capacitor"
        shell: bash
        run: |
          set -e

          cd app

          npm install \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8

      - name: "⚙️ إعداد Capacitor"
        shell: bash
        run: |
          set -e

          cd app

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ahmedgames.app",
            "appName": "Ahmed Games",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          echo "✅ Capacitor جاهز"

      - name: "🤖 إنشاء مشروع Android"
        shell: bash
        run: |
          set -e

          cd app

          npx cap add android

      - name: "🔄 مزامنة Android"
        shell: bash
        run: |
          set -e

          cd app

          npx cap sync android

      - name: "📱 إعداد Android SDK"
        uses: android-actions/setup-android@v3

      - name: "🛠️ تثبيت Android SDK"
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: "🔐 إعطاء صلاحية Gradle"
        shell: bash
        run: |
          set -e

          cd app/android

          chmod +x gradlew

      - name: "🔨 بناء APK"
        shell: bash
        run: |
          set -e

          cd app/android

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: "📤 تجهيز APK النهائي"
        shell: bash
        run: |
          set -e

          mkdir -p output

          APK=$(find app/android \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "❌ APK لم يتم إنشاؤه"
            exit 1
          fi

          cp "$APK" output/Ahmed-Games.apk

          echo "================================"
          echo "🎉 APK جاهز"
          echo "================================"

          ls -lh output/Ahmed-Games.apk

      - name: "⬆️ رفع APK"
        uses: actions/upload-artifact@v4
        with:
          name: APK-جاهز
          path: output/Ahmed-Games.apk
          if-no-files-found: error
          retention-days: 30
